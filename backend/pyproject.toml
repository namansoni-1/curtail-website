[project]
name = "curtail"
version = "0.1.0"
description = "Curtail Replay: counterfactual power-flexibility analysis for multi-tenant data centers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "ortools>=9.10",
    "lightgbm>=4.3",
    "httpx>=0.27",
    "reportlab>=4.2",
    "matplotlib>=3.9",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["curtail"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection idiom.
"curtail/api/*.py" = ["B008"]
