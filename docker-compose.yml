# Curtail Replay, fully local: TimescaleDB, the FastAPI backend, and the web app.
#   docker compose up --build
#   open http://localhost:3000/replay
services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: curtail
      POSTGRES_PASSWORD: curtail
      POSTGRES_DB: curtail
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curtail"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      CURTAIL_DATABASE_URL: postgresql+psycopg://curtail:curtail@db:5432/curtail
      CURTAIL_DATA_DIR: /data
      CURTAIL_CORS_ORIGINS: http://localhost:3000
      CURTAIL_PJM_API_KEY: ${CURTAIL_PJM_API_KEY:-}
    volumes:
      - curtail-data:/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_CURTAIL_API: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  curtail-data:
